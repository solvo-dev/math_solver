[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msolver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "gradio>=6.2.0",
    "sentence-transformers>=2.7.0",
    "scikit-learn>=1.5.0",
    "datasets>=2.19.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",  # verbose output
    "--strict-markers",  # error on unknown markers
    "--tb=short",  # shorter traceback format
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
msolver = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "msolver",
]
